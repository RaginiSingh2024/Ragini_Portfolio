<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="invGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="invBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="invChartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>
  <!-- Rounded tile base -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#invGradBg)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="2" />
  
  <!-- Isometric Box base / Inventory Cube (left bottom) -->
  <!-- Top Face -->
  <polygon points="34,44 50,36 66,44 50,52" fill="#34D399" opacity="0.9" />
  <!-- Left Face -->
  <polygon points="34,44 50,52 50,72 34,64" fill="#059669" />
  <!-- Right Face -->
  <polygon points="50,52 66,44 66,64 50,72" fill="#047857" />
  <!-- Center Box line/tape -->
  <path d="M 42 40 L 58 48" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" />
  
  <!-- Analytics / Forecasting Trendline rising above the box -->
  <path d="M 22 60 L 38 46 L 54 50 L 76 24" fill="none" stroke="url(#invChartGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Forecast Prediction Dots / Glowing nodes -->
  <circle cx="22" cy="60" r="3" fill="#10B981" />
  <circle cx="38" cy="46" r="3" fill="#34D399" />
  <circle cx="54" cy="50" r="3" fill="#38BDF8" />
  <!-- Final Arrow / Glowing Head -->
  <circle cx="76" cy="24" r="4.5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Bar chart bars in background subtle -->
  <rect x="22" y="66" width="4" height="8" rx="1.5" fill="#10B981" opacity="0.6" />
  <rect x="34" y="70" width="4" height="4" rx="1.5" fill="#34D399" opacity="0.6" />
  <rect x="68" y="58" width="4" height="16" rx="1.5" fill="#38BDF8" opacity="0.6" />
  <rect x="76" y="44" width="4" height="30" rx="1.5" fill="#60A5FA" opacity="0.75" />
</svg>
